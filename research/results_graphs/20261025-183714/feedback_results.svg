   <text style="fill: #203044; font: 11px 'DejaVu Sans'" transform="translate(47.52 85.579187)">Each row uses 24 decisions across 12 synthetic history templates.</text>
  </g>
  <g id="text_38">
   <text style="fill: #203044; font: 10px 'DejaVu Sans'" transform="translate(47.52 604.602813)">The histories were supplied by the researcher. These are descriptive plots of synthetic-feedback probes.</text>
   <text style="fill: #203044; font: 10px 'DejaVu Sans'" transform="translate(47.52 618.84)">They do not show that agents developed a convention through independent interaction. Source: earlier restraint study.</text>
  </g>
